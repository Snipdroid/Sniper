plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.8.10'
}

android {
    namespace 'ren.imyan.sniper'
    compileSdk 35

    defaultConfig {
        applicationId "ren.imyan.sniper"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.3'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui:1.7.8'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.8'
//    implementation 'androidx.compose.material:material:1.7.8'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    // Koin 依赖注入 https://insert-koin.io
    implementation 'io.insert-koin:koin-android:3.5.6'

    // Coil 图片加载 https://github.com/coil-kt/coil
    implementation 'io.coil-kt:coil:2.6.0'
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // Ktor Client
    implementation 'io.ktor:ktor-client-core:2.3.11'
    implementation 'io.ktor:ktor-serialization-kotlinx-json:2.3.11'
    implementation 'io.ktor:ktor-client-content-negotiation:2.3.11'
    implementation 'io.ktor:ktor-client-android:2.3.11'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation "io.ktor:ktor-client-logging:2.3.11"

    // timber 日志 https://github.com/JakeWharton/timber
    implementation 'com.jakewharton.timber:timber:5.0.1'

    implementation 'androidx.navigation:navigation-compose:2.8.8'
    implementation 'com.google.accompanist:accompanist-navigation-animation:0.34.0'

    // Coroutine 协程 https://developer.android.google.cn/kotlin/coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.compose.material3:material3-android:1.3.1'

    implementation "androidx.paging:paging-compose:3.3.6"

    implementation "androidx.paging:paging-runtime:3.3.6"
    implementation 'androidx.compose.material3:material3-adaptive-navigation-suite-android:1.3.1'

    implementation "org.slf4j:slf4j-android:1.7.32"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.6.7'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.6.7'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.6.7'
}